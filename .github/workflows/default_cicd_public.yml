name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    # Run daily at 3:17 AM UTC (off-peak hours, odd minute to avoid congestion)
    - cron: '17 3 * * *'

jobs:
  setup:
    name: Extract Python versions and OS matrix from pyproject.toml
    runs-on: ubuntu-latest
    outputs:
      python-versions: ${{ steps.metadata.outputs.python-versions }}
      python-latest: ${{ steps.metadata.outputs.python-latest }}
      os-matrix: ${{ steps.metadata.outputs.os-matrix }}
      matrix-include: ${{ steps.metadata.outputs.matrix-include }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Parse pyproject.toml for Python versions and OS matrix
        id: metadata
        shell: python
        run: |
          import json, os, tomllib

          with open("pyproject.toml", "rb") as f:
              data = tomllib.load(f)

          # Python versions from classifiers
          classifiers = data.get("project", {}).get("classifiers", [])
          prefix = "Programming Language :: Python :: "
          versions = [
              c[len(prefix):]
              for c in classifiers
              if c.startswith(prefix) and "." in c[len(prefix):]
          ]
          if not versions:
              raise SystemExit("No Python X.Y versions found in classifiers")

          # OS matrix from [tool.ci]
          ci_config = data.get("tool", {}).get("ci", {})
          os_list = ci_config.get("os", ["ubuntu-latest"])

          # Free-threaded builds from [tool.ci] free-threaded = ["3.15", ...]. They cannot
          # be classifiers: "3.15t" is not a trove classifier and hatchling refuses to
          # build with an unknown one. PyPI's own marker is the version-less
          # "Free Threading :: <level>" classifier, so each entry must name a version
          # the classifiers already declare.
          free_threaded = ci_config.get("free-threaded", [])
          for entry in free_threaded:
              if not (isinstance(entry, str) and len(entry.split(".")) == 2
                      and all(p.isascii() and p.isdigit() for p in entry.split("."))):
                  raise SystemExit(f'[tool.ci] free-threaded: {entry!r} is not an "X.Y" version string')
              if entry not in versions:
                  raise SystemExit(
                      f"[tool.ci] free-threaded: {entry} is not declared as a "
                      f'"{prefix}{entry}" classifier'
                  )
          if free_threaded and not any(c.startswith(prefix + "Free Threading") for c in classifiers):
              print(f'::warning::[tool.ci] free-threaded is set, but no "{prefix}Free Threading :: '
                    '<level>" classifier tells PyPI users the package supports it')

          # macOS runners are slow, so macOS tests only the newest declared Python
          # (the regular build); every other OS tests them all, free-threaded cells
          # ("3.15t", which setup-python installs) included. Newest by version number,
          # never by classifier order.
          latest = max(versions, key=lambda v: tuple(int(p) for p in v.split(".")))
          include = [
              {"os": os_name, "python": python}
              for os_name in os_list
              for version in versions
              for python in [version] + ([version + "t"] if version in free_threaded else [])
              if not os_name.startswith("macos") or python == latest
          ]

          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"python-versions={json.dumps(versions)}\n")
              fh.write(f"python-latest={latest}\n")
              fh.write(f"os-matrix={json.dumps(os_list)}\n")
              fh.write(f"matrix-include={json.dumps(include)}\n")

  test:
    name: Tests (Python ${{ matrix.python }}, ${{ matrix.os }})
    needs: setup
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # One entry per (os, python) pair from the setup job's matrix-include,
        # which keeps macOS to the newest Python.
        include: ${{ fromJSON(needs.setup.outputs.matrix-include) }}
    env:
      PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"
      PYTHONIOENCODING: "utf-8"
      UV_LINK_MODE: "copy"
      UV_BREAK_SYSTEM_PACKAGES: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          prune-cache: false

      - name: Install bash 4+ on macOS
        if: runner.os == 'macOS'
        run: |
          brew install bash
          # Only bash's own bin dir: all of $(brew --prefix)/bin would also put Homebrew's
          # python3 ahead of setup-python's, and every later `python`/`pytest` would run it.
          echo "$(brew --prefix bash)/bin" >> "$GITHUB_PATH"

      - name: Extract project metadata
        id: metadata
        uses: ./.github/actions/extract-metadata

      - name: Install CI system dependencies (Ubuntu)
        if: runner.os == 'Linux'
        shell: python
        run: |
          import subprocess
          try:
              import tomllib
          except ModuleNotFoundError:
              import pip._vendor.tomli as tomllib
          with open("pyproject.toml", "rb") as f:
              data = tomllib.load(f)
          deps = data.get("tool", {}).get("ci", {}).get("system-dependencies-ubuntu", [])
          if deps:
              print(f"Installing system packages: {' '.join(deps)}")
              subprocess.check_call(["sudo", "apt-get", "update"])
              subprocess.check_call(["sudo", "apt-get", "install", "-y", *deps])
          else:
              print("No CI system dependencies configured for Ubuntu.")

      - name: Install CI system dependencies (macOS)
        if: runner.os == 'macOS'
        shell: python
        run: |
          import subprocess
          try:
              import tomllib
          except ModuleNotFoundError:
              import pip._vendor.tomli as tomllib
          with open("pyproject.toml", "rb") as f:
              data = tomllib.load(f)
          deps = data.get("tool", {}).get("ci", {}).get("system-dependencies-macos", [])
          if deps:
              print(f"Installing system packages: {' '.join(deps)}")
              subprocess.check_call(["brew", "install", *deps])
          else:
              print("No CI system dependencies configured for macOS.")

      - name: Install dev deps
        shell: python
        run: |
          import os, subprocess, sys, tempfile
          from pathlib import Path
          try:
              import tomllib
          except ModuleNotFoundError:
              import pip._vendor.tomli as tomllib

          # Push and pull_request runs install exactly the tree uv.lock pins - versions
          # plus file hashes, which uv verifies - so CI tests what the lock ships and no
          # release published upstream since the last lock refresh can enter the build.
          # The nightly schedule run resolves afresh instead (still inside the project's
          # [tool.uv] exclude-newer cooldown, which uv honours here): it is the canary
          # that reports upstream breakage before a lock refresh adopts it. A project
          # without a uv.lock keeps the unlocked install.
          with open("pyproject.toml", "rb") as f:
              data = tomllib.load(f)
          # Asking uv for an extra the project does not declare is a hard error.
          extra = ["--extra", "dev"] if "dev" in data.get("project", {}).get("optional-dependencies", {}) else []
          # The job runs no venv: install into the interpreter running this step, which is
          # setup-python's. --system would take the first python on PATH instead.
          target = ["--python", sys.executable]
          locked = Path("uv.lock").is_file() and os.environ["GITHUB_EVENT_NAME"] != "schedule"
          if locked:
              req = Path(tempfile.mkdtemp()) / "locked-requirements.txt"
              # --locked fails when pyproject.toml changed without a lock refresh.
              subprocess.check_call(["uv", "export", "--locked", "--no-emit-project", *extra, "-o", str(req), "--quiet"])
              subprocess.check_call(["uv", "pip", "install", *target, "-r", str(req)])
              subprocess.check_call(["uv", "pip", "install", *target, "--no-deps", "-e", "."])
          else:
              subprocess.check_call(["uv", "pip", "install", *target, "-e", ".[dev]" if extra else "."])

      - name: Assert the matrix interpreter
        shell: python
        run: |
          import os, re, shutil, sys
          from pathlib import Path

          # Every later step runs python, pytest, ruff ... from PATH. If anything puts another
          # installation's bin dir ahead of setup-python's (Homebrew's did, on macOS), the job
          # tests that Python while its name still says the matrix version, and stays green.
          location = Path(os.environ["pythonLocation"])
          root = location.resolve()
          # On macOS the toolcache dir's bin is a SYMLINK into the python.org framework install
          # (actions/python-versions installers/macos-pkg-setup-template.sh), so a resolved
          # interpreter path lies there, outside $pythonLocation. Accept the install it points at.
          roots = {root} | {(location / d).resolve().parent for d in ("bin", "Scripts") if (location / d).is_dir()}


          def under_root(path):
              real = path.resolve()
              for candidate in roots:
                  try:
                      real.relative_to(candidate)
                      return True
                  except ValueError:
                      pass
              return False


          def script_interpreter(script):
              head = script.read_text(encoding="utf-8", errors="replace").splitlines()[:3]
              if not head or not head[0].startswith("#!"):
                  return None
              # A long interpreter path is written as #!/bin/sh plus an exec line.
              exec_line = re.search(r"exec' \"([^\"]+)\"", "\n".join(head))
              return Path(exec_line.group(1) if exec_line else head[0][2:].split()[0])


          problems = []
          if not under_root(Path(sys.executable)):
              problems.append(f"python on PATH is {Path(sys.executable).resolve()}, not under {root}")
          pytest_path = shutil.which("pytest")
          if pytest_path is None:
              problems.append("pytest is not on PATH")
          elif os.name == "nt":
              if not under_root(Path(pytest_path)):
                  problems.append(f"pytest on PATH is {pytest_path}, not under {root}")
          else:
              interpreter = script_interpreter(Path(pytest_path))
              if interpreter is None or not under_root(interpreter):
                  problems.append(f"pytest on PATH ({pytest_path}) runs {interpreter}, not an interpreter under {root}")
          for problem in problems:
              print(f"::error::{problem}")
          if problems:
              sys.exit(1)
          print(f"python and pytest both run from {root}")

      - name: Install CI system dependencies (Windows/choco)
        if: runner.os == 'Windows'
        shell: python
        run: |
          import subprocess
          try:
              import tomllib
          except ModuleNotFoundError:
              import pip._vendor.tomli as tomllib
          with open("pyproject.toml", "rb") as f:
              data = tomllib.load(f)
          deps = data.get("tool", {}).get("ci", {}).get("system-dependencies-windows-choco", [])
          if deps:
              print(f"Installing choco packages: {' '.join(deps)}")
              subprocess.check_call(["choco", "install", "-y", *deps])
          else:
              print("No CI choco dependencies configured for Windows.")

      - name: Install CI pip dependencies (Windows)
        if: runner.os == 'Windows'
        shell: python
        run: |
          import subprocess, sys
          try:
              import tomllib
          except ModuleNotFoundError:
              import pip._vendor.tomli as tomllib
          with open("pyproject.toml", "rb") as f:
              data = tomllib.load(f)
          deps = data.get("tool", {}).get("ci", {}).get("system-dependencies-windows-pip", [])
          if deps:
              print(f"Installing pip packages: {' '.join(deps)}")
              subprocess.check_call(["uv", "pip", "install", *deps, "--python", sys.executable])
          else:
              print("No CI pip dependencies configured for Windows.")

      # Self-hosted runners persist ruff cache via RUFF_CACHE_DIR volume mount,
      # so actions/cache is only needed on GitHub-hosted runners.
      - name: Restore ruff cache
        if: runner.environment == 'github-hosted'
        id: ruff-cache
        uses: actions/cache/restore@v6
        with:
          path: .ruff_cache
          key: ruff-${{ runner.os }}-py${{ matrix.python }}-${{ github.sha }}
          restore-keys: |
            ruff-${{ runner.os }}-py${{ matrix.python }}-
            ruff-${{ runner.os }}-

      - name: Run ruff (lint + format)
        id: ruff
        continue-on-error: true
        shell: bash
        run: |
          ruff check .
          ruff format --check .

      - name: Run pyright (type check)
        id: pyright
        continue-on-error: true
        shell: bash
        run: pyright

      - name: Choose pytest workers
        id: workers
        shell: python
        run: |
          # Run the suite across processes exactly when bmk's `make test` does (bmk
          # adapters/stagerunner/helpers/_parallel.py): only when the project's configured
          # pytest loads pytest-xdist AND pytest-cov (this job always measures coverage, and
          # only pytest-cov carries it into the workers), with [tool.scripts.test] workers
          # as the count ("1" is serial). A project's own -n or --dist is its choice and is
          # kept. What pytest loads is asked of pytest itself, never inferred from what is
          # importable: addopts can block a plugin and autoload can be off.
          import json
          import os
          import platform
          import subprocess
          import sys
          import tempfile

          try:
              import tomllib
          except ModuleNotFoundError:  # Python 3.10
              import pip._vendor.tomli as tomllib

          PROBE = """
          import json, sys
          import pytest
          facts = {}
          class _Probe:
              @pytest.hookimpl(tryfirst=True)
              def pytest_cmdline_main(self, config):
                  plugins = config.pluginmanager
                  facts["xdist"] = plugins.hasplugin("xdist")
                  facts["cov"] = plugins.hasplugin("pytest_cov")
                  facts["own_n"] = getattr(config.option, "numprocesses", None) is not None
                  facts["own_dist"] = getattr(config.option, "dist", "no") not in ("no", None)
                  return 0
          pytest.main(["-p", "no:cacheprovider"], plugins=[_Probe()])
          # pytest-xdist 3.8.0 groups a test by renaming item._nodeid, which pytest 9.2.0's Node.nodeid never
          # reads (pytest-xdist issue #1386): --dist loadgroup then spreads every xdist_group over all workers
          # and the run stays green. Asked of the installed code rather than its versions, so a fixed release
          # lifts it; a check that cannot answer leaves the field unset and the run parallel.
          if facts.get("xdist"):
              try:
                  import inspect, xdist.remote
                  from _pytest.nodes import Node
                  renames = "item._nodeid =" in inspect.getsource(xdist.remote)
                  node = object.__new__(Node)
                  try:
                      node._nodeid = "group-probe"
                      honoured = node.nodeid == "group-probe"
                  except Exception:
                      honoured = False
                  facts["groups_ignored"] = renames and not honoured
              except Exception:
                  pass
          with open(sys.argv[1], "w", encoding="utf-8") as out:
              json.dump(facts, out)
          """


          def cpu_model():
              try:
                  with open("/proc/cpuinfo", encoding="utf-8") as f:
                      for line in f:
                          if line.startswith("model name"):
                              return line.split(":", 1)[1].strip()
              except OSError:
                  pass
              return platform.processor() or "unknown CPU"


          def workers_setting():
              with open("pyproject.toml", "rb") as f:
                  raw = tomllib.load(f).get("tool", {}).get("scripts", {}).get("test", {}).get("workers", "auto")
              if isinstance(raw, str) and raw.strip().lower() == "auto":
                  return "auto"
              # bool is an int subclass, and `workers = true` is no count.
              if isinstance(raw, int) and not isinstance(raw, bool) and raw >= 1:
                  return str(raw)
              if isinstance(raw, str) and raw.strip().isascii() and raw.strip().isdigit() and int(raw) >= 1:
                  return str(int(raw))
              print(f'::error::[tool.scripts.test] workers must be "auto" or a whole number >= 1 (1 means serial), got: {raw!r}')
              sys.exit(1)


          workers = workers_setting()
          print(f"Runner: {cpu_model()}, {os.cpu_count()} CPUs")
          with tempfile.TemporaryDirectory() as tmp:
              answer = os.path.join(tmp, "plugins.json")
              subprocess.run([sys.executable, "-c", PROBE, answer], check=True, stdout=subprocess.DEVNULL)
              with open(answer, encoding="utf-8") as f:
                  facts = json.load(f)

          if workers == "1":
              serial = "[tool.scripts.test] workers = 1"
          elif not (facts["xdist"] and facts["cov"]):
              serial = "pytest-xdist and pytest-cov are not both loaded"
          elif facts.get("groups_ignored"):
              serial = "this pytest drops pytest-xdist's xdist_group marks (pytest-xdist issue #1386)"
          else:
              serial = None

          if serial:
              args = "-n 0" if facts["xdist"] and facts["own_n"] else ""
              print(f"pytest runs serial: {serial}")
          elif facts["own_n"]:
              args = ""
              print("pytest runs with the project's own -n")
          else:
              args = " ".join(["-n", workers] + ([] if facts["own_dist"] else ["--dist", "loadgroup"]))
              print(f"pytest runs in parallel: {args}")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"args={args}\n")

      - name: Run pytest (tests + coverage)
        id: pytest
        continue-on-error: true
        shell: bash
        env:
          TEST_VERBOSE: "1"
          # Write coverage SQLite database to local disk — network mounts
          # and stale journal files cause "database is locked" errors.
          COVERAGE_FILE: "${{ runner.temp }}/.coverage"
        run: >-
          pytest -m "${{ env.PYTEST_MARKER_EXPR }}"
          ${{ steps.workers.outputs.args }}
          --cov=${{ env.SRC_PATH }}/${{ env.PACKAGE_MODULE }}
          --cov-report=term-missing
          --cov-report=xml:${{ env.COV_REPORT_FILE }}
          --cov-fail-under=${{ env.COV_FAIL_UNDER }}
          ${{ env.PYTEST_VERBOSITY }}

      - name: Upload coverage to Codecov
        if: >-
          always()
          && steps.pytest.outcome == 'success'
          && matrix.os == 'ubuntu-latest'
          && matrix.python == needs.setup.outputs.python-latest
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          files: ${{ env.COV_REPORT_FILE }}
          fail_ci_if_error: false

      - name: Run import-linter (architecture)
        id: importlinter
        continue-on-error: true
        shell: bash
        run: lint-imports

      - name: Run bandit (security scan)
        id: bandit
        continue-on-error: true
        shell: bash
        run: bandit -q -c pyproject.toml -r ${{ env.SRC_PATH }}/${{ env.PACKAGE_MODULE }} ${{ env.BANDIT_SKIP_FLAG }}

      - name: Run pip-audit (vulnerability scan)
        id: pipaudit
        continue-on-error: true
        shell: python
        run: |
          import os, subprocess, sys, tempfile
          import rtoml
          from pathlib import Path

          # Audit the project's OWN resolved dependency tree, not the ambient
          # environment. "Install dev deps" installs into setup-python's interpreter,
          # which belongs to the runner image, and that image ships packages
          # this project neither declares nor distributes (setuptools, pip,
          # wheel). Auditing those reported CVEs no consumer of this project is
          # exposed to, and a scan that is permanently yellow is a scan everyone
          # learns to ignore. Resolving pyproject.toml here keeps the result
          # identical on every OS/python and dependent only on what we declare.
          data = rtoml.load(Path("pyproject.toml"))

          # Not every project declares dev dependencies, and those that do may use
          # either an extra or a PEP 735 group. Asking uv for one that does not
          # exist is a hard error ("Requested extra not found"), which would leave
          # the audit permanently broken here rather than merely noisy, so select
          # the flag from what this project actually declares.
          selector = []
          if "dev" in data.get("project", {}).get("optional-dependencies", {}):
              selector = ["--extra", "dev"]
          elif "dev" in data.get("dependency-groups", {}):
              selector = ["--group", "dev"]

          tmp = Path(tempfile.mkdtemp())
          req = tmp / "compiled-requirements.txt"
          # With a uv.lock the install step put exactly the locked tree on the
          # runner, so audit that tree; the schedule canary and lock-less
          # projects resolve pyproject.toml afresh, as their install did.
          if Path("uv.lock").is_file() and os.environ["GITHUB_EVENT_NAME"] != "schedule":
              subprocess.check_call(
                  ["uv", "export", "--locked", "--no-emit-project", "--no-hashes", *selector,
                   "-o", str(req), "--quiet"]
              )
          else:
              subprocess.check_call(
                  ["uv", "pip", "compile", *selector, "pyproject.toml", "-o", str(req), "--quiet"]
              )

          # Drop direct URL references ("pkg @ git+https://...") before auditing.
          # pip-audit cannot audit those (they are not on PyPI) but, given a
          # requirements file, first tries to `git clone` each one to resolve a
          # version - a slow, credential-dependent fetch. No public project here
          # uses one today, yet "allow-direct-references" is enabled, so this
          # guards the day one appears and keeps this step identical to the
          # default_cicd_private template's.
          audit_req = tmp / "audit-requirements.txt"
          kept, dropped = [], []
          for line in req.read_text(encoding="utf-8").splitlines():
              if " @ " in line and not line.lstrip().startswith("#"):
                  dropped.append(line.split(" @ ", 1)[0].strip())
              else:
                  kept.append(line)
          audit_req.write_text("\n".join(kept) + "\n", encoding="utf-8")
          if dropped:
              # Never drop coverage silently: name what is not being audited here.
              print(f"::notice::pip-audit: not auditing {len(dropped)} direct-URL dependency/ies "
                    f"(audited in their own repo): {', '.join(sorted(dropped))}")

          req = audit_req
          vulns = data.get("tool", {}).get("pip-audit", {}).get("ignore-vulns", [])
          # --no-deps: the compiled file is already a complete pinned resolution,
          # so pip-audit must audit it verbatim rather than re-resolving it.
          cmd = ["pip-audit", "--no-deps", "-r", str(req)]
          for v in vulns:
              cmd.extend(["--ignore-vuln", v])
          sys.exit(subprocess.call(cmd))

      - name: Check all steps passed
        shell: bash
        run: |
          if [[ "${{ steps.ruff.outcome }}" != "success" ]]; then
            echo "::error::Ruff check failed"
            exit 1
          fi
          if [[ "${{ steps.pyright.outcome }}" != "success" ]]; then
            echo "::error::Pyright check failed"
            exit 1
          fi
          if [[ "${{ steps.pytest.outcome }}" != "success" ]]; then
            echo "::error::Pytest failed"
            exit 1
          fi
          if [[ "${{ steps.importlinter.outcome }}" != "success" ]]; then
            echo "::error::Import-linter check failed"
            exit 1
          fi
          if [[ "${{ steps.bandit.outcome }}" != "success" ]]; then
            echo "::error::Bandit security scan failed"
            exit 1
          fi
          if [[ "${{ steps.pipaudit.outcome }}" != "success" ]]; then
            echo "::warning::pip-audit vulnerability scan failed"
          fi
          echo "All checks passed!"

      - name: Build wheel/sdist
        shell: bash
        run: uv build

      - name: Verify wheel install in clean env
        shell: bash
        run: |
          uv venv .venv_wheel
          . .venv_wheel/bin/activate 2>/dev/null || . .venv_wheel/Scripts/activate 2>/dev/null
          uv pip install dist/*.whl
          "$CLI_BIN" --version 2>/dev/null || python -m "$PACKAGE_MODULE" --version

      - name: Prune uv cache
        continue-on-error: true
        shell: bash
        run: uv cache prune --ci

      - name: Save ruff cache
        if: always() && runner.environment == 'github-hosted' && steps.ruff-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .ruff_cache
          key: ruff-${{ runner.os }}-py${{ matrix.python }}-${{ github.sha }}

  pipx-uv:
    name: pipx/uv verification (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          prune-cache: false

      - name: Extract project metadata
        id: metadata
        uses: ./.github/actions/extract-metadata

      - name: Build wheel
        run: uv build
      - name: pipx install from wheel
        run: |
          uv pip install --system pipx
          pipx ensurepath
          export PATH="$HOME/.local/bin:$PATH"
          pipx install dist/*.whl
          "$CLI_BIN" --version

      - name: uv tool install
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv tool install --force .
          "$CLI_BIN" --version

      - name: Prune uv cache
        continue-on-error: true
        run: uv cache prune --ci

  notebooks:
    name: Execute notebooks (ubuntu, Python 3.14)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          prune-cache: false

      - name: Install notebook runner deps
        run: |
          uv pip install --system nbclient nbformat ipykernel jupyter_client
          python -m ipykernel install --user --name python3 --display-name "Python 3"
      - name: Execute Quickstart notebook
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
          PIP_NO_INPUT: "1"
        run: |
          python - << 'PY'
          from pathlib import Path

          import nbformat
          from nbclient import NotebookClient

          nb_path = Path('notebooks/Quickstart.ipynb')
          if not nb_path.exists():
              raise SystemExit(f"Notebook not found: {nb_path}")

          notebook = nbformat.read(nb_path, as_version=4)
          client = NotebookClient(
              notebook,
              timeout=900,
              kernel_name='python3',
              allow_errors=False,
          )
          client.execute()

          out_path = Path('notebooks/Quickstart-executed.ipynb')
          nbformat.write(notebook, out_path)
          print(f"Executed notebook written to: {out_path}")
          PY
